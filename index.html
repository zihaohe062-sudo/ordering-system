<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡約點餐</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/customer.css">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <div class="header-brand-icon">☕</div>
      <span>簡約點餐</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" id="lang-toggle">EN</button>
      <button class="btn btn-ghost btn-icon btn-sm" id="theme-toggle" aria-label="切換主題">
        <span class="theme-icon-light">🌙</span>
        <span class="theme-icon-dark" style="display:none;">☀️</span>
      </button>
    </div>
  </header>

  <main class="customer-view active">
    <div class="hero-section">
      <div class="hero-title">歡迎光臨</div>
      <div class="hero-subtitle">選取您喜愛的餐點，輕鬆下單</div>
    </div>
    <div class="container">
      <div id="category-tabs" class="category-tabs"></div>
      <div id="menu-grid" class="menu-grid"></div>
    </div>
  </main>

  <div id="cart-overlay" class="modal-overlay" style="background: rgba(0,0,0,0.3);"></div>
  <div id="cart-drawer" class="cart-drawer">
    <div class="cart-drawer-handle"></div>
    <div class="cart-drawer-header">
      <div class="cart-drawer-title">購物車</div>
      <button class="cart-drawer-close" id="close-cart-btn" aria-label="關閉">✕</button>
    </div>
    <div class="cart-drawer-body"></div>
    <div class="cart-drawer-footer" style="display: none;">
      <div class="cart-summary"></div>
      <button class="btn btn-primary btn-full btn-lg cart-checkout-btn" id="checkout-btn">前往結帳</button>
    </div>
  </div>

  <div id="checkout-modal" class="modal-overlay checkout-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">確認訂單</div>
        <button class="modal-close" id="close-checkout-btn" aria-label="關閉">✕</button>
      </div>
      <div class="modal-body">
        <form class="checkout-form" id="checkout-form">
          <div class="checkout-form-group">
            <label class="label" for="customerName">顧客姓名 *</label>
            <input class="input" type="text" id="customerName" name="customerName" placeholder="請輸入姓名" required>
          </div>
          <div class="checkout-form-group">
            <label class="label" for="phone">聯絡電話 *</label>
            <input class="input" type="tel" id="phone" name="phone" placeholder="例如：91234567" required>
          </div>
          <div class="checkout-form-row">
            <div class="checkout-form-group">
              <label class="label" for="tableNumber">桌號 / 外帶號碼 *</label>
              <input class="input" type="text" id="tableNumber" name="tableNumber" placeholder="例如：5 或 外帶" required>
            </div>
            <div class="checkout-form-group">
              <label class="label" for="pickupTime">取餐時間</label>
              <input class="input" type="time" id="pickupTime" name="pickupTime">
            </div>
          </div>
          <div class="checkout-form-group">
            <label class="label" for="notes">訂單備註</label>
            <textarea class="textarea" id="notes" name="notes" placeholder="例如：少辣、不要洋蔥..." rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg">送出訂單</button>
        </form>
      </div>
    </div>
  </div>

  <nav class="mobile-footer">
    <div class="footer-item active" data-view="customer">
      <div class="footer-item-icon">🍽️</div>
      <span>點餐</span>
    </div>
    <div class="footer-item" id="mobile-cart-btn">
      <div class="footer-item-icon footer-badge">
        🛒
        <span class="footer-badge-count" id="mobile-cart-badge" style="display:none;">0</span>
      </div>
      <span>購物車</span>
    </div>
    <a href="admin.html" class="footer-item">
      <div class="footer-item-icon">⚙️</div>
      <span>管理</span>
    </a>
  </nav>

  <script type="module" src="js/app-customer.js"></script>
</body>
</html>
