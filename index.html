<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡約點餐 — Order System</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/customer.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ═══ Header ═══ -->
  <header class="header">
    <div class="header-brand">
      <div class="header-brand-icon">☕</div>
      <span>簡約點餐</span>
    </div>

    <nav class="header-nav">
      <button class="header-nav-item active" data-view="customer">點餐</button>
      <button class="header-nav-item" data-view="admin">後台管理</button>
    </nav>

    <div class="header-actions">
      <button class="btn btn-ghost btn-icon btn-sm" id="theme-toggle" aria-label="切換主題">
        <span class="theme-icon-light">🌙</span>
        <span class="theme-icon-dark" style="display:none;">☀️</span>
      </button>
      <button class="btn btn-ghost btn-icon btn-sm relative" id="open-cart-btn" aria-label="購物車" style="display:none;">
        🛒
        <span class="footer-badge-count" id="cart-badge" style="display:none;">0</span>
      </button>
    </div>
  </header>

  <!-- ═══ Customer View ═══ -->
  <main id="customer-view" class="customer-view active">
    <div class="hero-section">
      <div class="hero-title">歡迎光臨</div>
      <div class="hero-subtitle">選取您喜愛的餐點，輕鬆下單</div>
    </div>

    <div class="container">
      <div id="category-tabs" class="category-tabs"></div>
      <div id="menu-grid" class="menu-grid"></div>
    </div>
  </main>

  <!-- ═══ Admin View ═══ -->
  <div id="admin-view" class="admin-view">
    <div class="page">
      <div class="page-main" style="margin-left: 0;">
        <div class="page-header">
          <h1 class="page-title">後台管理</h1>
          <p class="page-subtitle">訂單與菜單管理</p>
        </div>

        <div id="admin-stats" class="admin-stats"></div>

        <div class="admin-tabs">
          <button class="admin-tab active" data-tab="orders">訂單管理</button>
          <button class="admin-tab" data-tab="menu">菜單管理</button>
        </div>

        <div id="admin-orders-section">
          <div id="admin-orders" class="admin-orders"></div>
        </div>

        <div id="admin-menu-section" style="display: none;">
          <div id="admin-menu"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Cart Drawer ═══ -->
  <div id="cart-overlay" class="modal-overlay" style="background: rgba(0,0,0,0.3);"></div>
  <div id="cart-drawer" class="cart-drawer">
    <div class="cart-drawer-handle"></div>
    <div class="cart-drawer-header">
      <div class="cart-drawer-title">購物車</div>
      <button class="cart-drawer-close" id="close-cart-btn" aria-label="關閉">✕</button>
    </div>
    <div class="cart-drawer-body"></div>
    <div class="cart-drawer-footer" style="display: none;">
      <div class="cart-summary"></div>
      <button class="btn btn-primary btn-full btn-lg cart-checkout-btn" id="checkout-btn">前往結帳</button>
    </div>
  </div>

  <!-- ═══ Checkout Modal ═══ -->
  <div id="checkout-modal" class="modal-overlay checkout-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">確認訂單</div>
        <button class="modal-close" id="close-checkout-btn" aria-label="關閉">✕</button>
      </div>
      <div class="modal-body">
        <form class="checkout-form" id="checkout-form">
          <div class="checkout-form-group">
            <label class="label" for="customerName">顧客姓名 *</label>
            <input class="input" type="text" id="customerName" name="customerName" placeholder="請輸入姓名" required>
          </div>
          <div class="checkout-form-row">
            <div class="checkout-form-group">
              <label class="label" for="tableNumber">桌號 / 外帶號碼 *</label>
              <input class="input" type="text" id="tableNumber" name="tableNumber" placeholder="例如：5 或 外帶" required>
            </div>
            <div class="checkout-form-group">
              <label class="label" for="pickupTime">取餐時間</label>
              <input class="input" type="time" id="pickupTime" name="pickupTime">
            </div>
          </div>
          <div class="checkout-form-group">
            <label class="label" for="notes">訂單備註</label>
            <textarea class="textarea" id="notes" name="notes" placeholder="例如：少辣、不要洋蔥..." rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg">送出訂單</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ═══ Menu Form Modal ═══ -->
  <div id="menu-form-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">新增餐點</div>
        <button class="modal-close" id="close-menu-form-btn" aria-label="關閉">✕</button>
      </div>
      <div class="modal-body">
        <form class="menu-form">
          <div class="menu-form-group">
            <label class="label" for="menu-name">名稱 *</label>
            <input class="input" type="text" id="menu-name" name="name" placeholder="餐點名稱" required>
          </div>
          <div class="menu-form-group">
            <label class="label" for="menu-desc">描述</label>
            <textarea class="textarea" id="menu-desc" name="description" placeholder="簡短描述" rows="2"></textarea>
          </div>
          <div class="menu-form-row">
            <div class="menu-form-group">
              <label class="label" for="menu-price">價格 *</label>
              <input class="input" type="number" id="menu-price" name="price" min="0" step="1" placeholder="0" required>
            </div>
            <div class="menu-form-group">
              <label class="label" for="menu-category">分類</label>
              <select class="input select" id="menu-category" name="category">
                <option value="mains">主食</option>
                <option value="sides">小食</option>
                <option value="drinks">飲品</option>
                <option value="desserts">甜品</option>
              </select>
            </div>
          </div>
          <div class="menu-form-group">
            <label class="label" for="menu-tags">標籤（逗號分隔）</label>
            <input class="input" type="text" id="menu-tags" name="tags" placeholder="例如：人氣, 推薦">
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg">儲存</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ═══ Toast Container ═══ -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ═══ Mobile Footer ═══ -->
  <nav class="mobile-footer">
    <button class="footer-item active" data-view="customer">
      <div class="footer-item-icon">🍽️</div>
      <span>點餐</span>
    </button>
    <button class="footer-item" id="mobile-cart-btn">
      <div class="footer-item-icon footer-badge">
        🛒
        <span class="footer-badge-count" id="mobile-cart-badge" style="display:none;">0</span>
      </div>
      <span>購物車</span>
    </button>
    <button class="footer-item" data-view="admin">
      <div class="footer-item-icon">⚙️</div>
      <span>管理</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
